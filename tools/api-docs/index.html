<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solventa API documentation</title>
    <link rel="stylesheet" href="/api/docs/viewer.css" />
  </head>
  <body>
    <header class="docs-header" data-scalar-scroll-header>
      <a class="brand" href="/api/docs/" aria-label="Solventa API reference"><img src="/api/docs/wordmark.svg" alt="Solventa" width="116" height="28" /><span>API reference</span></a>
      <nav aria-label="API documentation">
        <span id="environment" class="environment"></span>
        <label class="visually-hidden" for="spec-select">Specification</label>
        <select id="spec-select" disabled></select>
        <a id="download-spec" hidden>OpenAPI JSON</a>
      </nav>
    </header>
    <p id="status" role="status">Loading specifications…</p>
    <main id="docs-reference" aria-label="API reference"></main>
    <noscript>Enable JavaScript to view the API reference.</noscript>
    <script src="/api/docs/scalar.js"></script>
    <script type="module" src="/api/docs/viewer.js"></script>
  </body>
</html>
