name: solventa-dev
services:
  certificates:
    image: cockroachdb/cockroach:v26.2.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ ! -f /certs/ca.crt ]; then
          cockroach cert create-ca --certs-dir=/certs --ca-key=/certs/ca.key
          cockroach cert create-node cockroach localhost 127.0.0.1 --certs-dir=/certs --ca-key=/certs/ca.key
          cockroach cert create-client root --certs-dir=/certs --ca-key=/certs/ca.key
        fi
    volumes:
      - ./.local/certs:/certs
  cockroach:
    image: cockroachdb/cockroach:v26.2.0
    command: start-single-node --certs-dir=/cockroach/certs --listen-addr=localhost:26257 --sql-addr=0.0.0.0:26258 --http-addr=0.0.0.0:8080 --cache=128MiB --max-sql-memory=128MiB
    depends_on:
      certificates:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:26258:26258
      - 127.0.0.1:8088:8080
    volumes:
      - ./.local/certs:/cockroach/certs:ro
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: [CMD, /cockroach/cockroach, sql, --certs-dir=/cockroach/certs, --host=localhost, --port=26258, --execute=SELECT 1]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  cockroach-data:
