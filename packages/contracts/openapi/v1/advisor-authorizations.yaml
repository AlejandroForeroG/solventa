      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - error
              - traceId
            properties:
              error:
                type: string
                enum:
                  - invalid_request
                  - unauthorized
                  - forbidden
                  - not_found
                  - method_not_allowed
                  - idempotency_conflict
                  - policy_not_active
                  - document_mismatch
