openapi: 3.0.3
info:
  title: Solventa API - Assistance providers
  version: 1.0.0
  description: Search of a synthetic assistance directory, which retains no search term or coordinate, and the customer's request for assistance on site from one of its providers, which is stored and can be read back by its owner. The provider is simulated; the request, its persistence, its authorization and its follow-up are not.
servers:
  - url: /api/v1
tags:
  - name: Assistance providers
    description: Customer lookup by manually entered place or explicitly authorized device coordinates.
  - name: Assistance requests
    description: The customer's own requests for assistance on site.
paths:
  /assistance/providers/search:
    post:
      operationId: searchAssistanceProviders
      summary: Find simulated assistance providers
      tags: [Assistance providers]
      security:
        - WebSession: []
        - LocalWebSession: []
        - NativeSession: []
      description: Requires assistance-providers:read through Identity. Web sessions also require a matching Origin. Send exactly one input shape and no more than 1024 bytes. POST keeps location out of the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ManualSearch'
                - $ref: '#/components/schemas/NearbySearch'
            examples:
              manual:
                value: { kind: manual, query: Bogotá }
              nearby:
                value: { kind: nearby, locationAuthorized: true, coordinates: { latitude: 4.648, longitude: -74.098 } }
      responses:
        '200':
          description: Simulated results. An empty list is a successful search with no matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Invalid credentials combination, JSON, search fields or location authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid customer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Session or request Origin is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authorization or the directory is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assistance/requests:
    post:
      operationId: createAssistanceRequest
      summary: Request assistance on site from one provider
      tags: [Assistance requests]
      security:
        - WebSession: []
        - LocalWebSession: []
        - NativeSession: []
      description: Requires assistance-requests:create through Identity. Web sessions also require a matching Origin. The customer names the provider and where they are, either by an explicitly authorized device position or by a confirmed address. The request is stored with a unique reference, a snapshot of the provider, the place, the date and its state. The Idempotency-Key header is required; repeating the same request returns the stored one with 200 and the same key with another request is a conflict. The body is at most 4096 bytes.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceRequestBody'
            examples:
              device:
                value: { providerId: demo-bog-workshop, place: { kind: device, authorized: true, coordinates: { latitude: 4.648, longitude: -74.098 } } }
              address:
                value: { providerId: demo-bog-workshop, place: { kind: address, address: 'Calle de prueba 10, Bogotá' } }
      responses:
        '201':
          description: The request was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequestResult'
        '200':
          description: The same request was already stored under this key and is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequestResult'
        '400':
          description: Invalid credentials combination, idempotency key, JSON, provider reference, place or location authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid customer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Session or request Origin is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The directory has no such provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET or POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The idempotency key was used for a different request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The body is not application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authorization, the directory or the store is unavailable. Nothing is acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listOwnAssistanceRequests
      summary: List the customer's own requests, newest first
      tags: [Assistance requests]
      security:
        - WebSession: []
        - LocalWebSession: []
        - NativeSession: []
      description: Requires assistance-requests:read through Identity. Returns at most 20 requests, always only the caller's own.
      responses:
        '200':
          description: The caller's requests, possibly none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequestList'
        '400':
          description: Invalid credentials combination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid customer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Session is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET or POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authorization or the store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assistance/requests/{requestId}:
    get:
      operationId: getOwnAssistanceRequest
      summary: Follow one of the customer's own requests
      tags: [Assistance requests]
      security:
        - WebSession: []
        - LocalWebSession: []
        - NativeSession: []
      description: Requires assistance-requests:read through Identity. A request of another customer is indistinguishable from one that does not exist.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The request and its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequestResult'
        '401':
          description: Missing or invalid customer session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Session is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such request for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method other than GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authorization or the store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-solventa-session
    LocalWebSession:
      type: apiKey
      in: cookie
      name: solventa-session
    NativeSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ManualSearch:
      type: object
      additionalProperties: false
      required: [kind, query]
      properties:
        kind:
          type: string
          enum: [manual]
        query:
          type: string
          minLength: 2
          maxLength: 160
          description: City, fixture address, or fixture address plus city. At least two characters after trimming.
    NearbySearch:
      type: object
      additionalProperties: false
      required: [kind, locationAuthorized, coordinates]
      properties:
        kind:
          type: string
          enum: [nearby]
        locationAuthorized:
          type: boolean
          enum: [true]
          description: Explicit, single-query authorization provided by the customer before the client reads location.
        coordinates:
          type: object
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
    Provider:
      type: object
      additionalProperties: false
      required: [id, kind, name, city, address, phone, hours]
      properties:
        id: { type: string, pattern: '^demo-[a-z0-9-]{1,48}$' }
        kind: { type: string, enum: [workshop, expert, roadside] }
        name: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, minLength: 1, maxLength: 160 }
        address: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, pattern: '^\+570{8}[0-9]{2}$' }
        hours: { type: string, minLength: 1, maxLength: 160 }
        distanceKm:
          type: number
          minimum: 0
          maximum: 25
          description: Straight-line distance returned only for coordinate search.
    SearchResult:
      type: object
      additionalProperties: false
      required: [simulated, providers, traceId]
      properties:
        simulated: { type: boolean, enum: [true] }
        providers:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Provider'
        traceId: { type: string, format: uuid }
    AssistanceRequestBody:
      type: object
      additionalProperties: false
      required: [providerId, place]
      properties:
        providerId: { type: string, pattern: '^demo-[a-z0-9-]{1,48}$' }
        place:
          oneOf:
            - $ref: '#/components/schemas/DevicePlace'
            - $ref: '#/components/schemas/AddressPlace'
    DevicePlace:
      type: object
      additionalProperties: false
      required: [kind, authorized, coordinates]
      properties:
        kind: { type: string, enum: [device] }
        authorized:
          type: boolean
          enum: [true]
          description: Explicit authorization given by the customer before the client reads the position. Without it the place is refused.
        coordinates:
          type: object
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
    AddressPlace:
      type: object
      additionalProperties: false
      required: [kind, address]
      properties:
        kind: { type: string, enum: [address] }
        address: { type: string, minLength: 2, maxLength: 160, description: The address the customer confirmed. }
    StoredPlace:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, latitude, longitude]
          properties:
            kind: { type: string, enum: [device] }
            latitude: { type: number, minimum: -90, maximum: 90 }
            longitude: { type: number, minimum: -180, maximum: 180 }
        - $ref: '#/components/schemas/AddressPlace'
    AssistanceRequest:
      type: object
      additionalProperties: false
      required: [id, reference, status, provider, place, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, pattern: '^ASI-[0-9A-HJKMNP-TV-Z]{8}$', description: Unique reference the customer can quote. }
        status:
          type: string
          enum: [requested]
          description: The only state today. The provider is simulated and its answer is not.
        provider:
          type: object
          additionalProperties: false
          required: [id, kind, name, city, address, phone, hours]
          properties:
            id: { type: string, pattern: '^demo-[a-z0-9-]{1,48}$' }
            kind: { type: string, enum: [workshop, expert, roadside] }
            name: { type: string, minLength: 1, maxLength: 160 }
            city: { type: string, minLength: 1, maxLength: 160 }
            address: { type: string, minLength: 1, maxLength: 160 }
            phone: { type: string, pattern: '^\+570{8}[0-9]{2}$' }
            hours: { type: string, minLength: 1, maxLength: 160 }
        place:
          $ref: '#/components/schemas/StoredPlace'
        createdAt: { type: string, format: date-time }
    AssistanceRequestResult:
      type: object
      additionalProperties: false
      required: [simulated, request, traceId]
      properties:
        simulated: { type: boolean, enum: [true] }
        request:
          $ref: '#/components/schemas/AssistanceRequest'
        traceId: { type: string, format: uuid }
    AssistanceRequestList:
      type: object
      additionalProperties: false
      required: [simulated, requests, traceId]
      properties:
        simulated: { type: boolean, enum: [true] }
        requests:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AssistanceRequest'
        traceId: { type: string, format: uuid }
    Error:
      type: object
      additionalProperties: false
      required: [error, traceId]
      properties:
        error:
          type: string
          enum: [invalid_request, unauthorized, forbidden, not_found, method_not_allowed, idempotency_conflict, unsupported_media_type, access_unavailable, directory_unavailable, service_unavailable]
        fields:
          type: array
          description: Names of the invalid fields, never their values.
          items: { type: string, enum: [idempotencyKey, body] }
        traceId: { type: string, format: uuid }
