openapi: 3.0.3
info:
  title: Solventa API - Policies
  version: 1.0.0
  description: Authenticated web-only academic financial flow. External data,
    payment and signature providers are explicitly mocked; Solventa
    authorization, owner transactions and idempotency remain real. Disabled in
    production. Credentials, actor identifiers, approval and amounts cannot be
    selected by clients. All responses are no-store and correlated.
servers:
  - url: /api/v1
tags:
  - name: Policies
    description: Owner-authorized synthetic policies.
paths:
  /policies/{policyId}:
    get:
      operationId: getOwnPolicy
      summary: Read owned policy and the document to review
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current or replayed result.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /policies/{policyId}/issue:
    post:
      operationId: issueOwnPolicy
      summary: Confirm the reviewed document and issue a policy
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
      responses:
        "200":
          description: Current or replayed result.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Requires same-origin POST and the exact documentHash returned by
        GET. The owner derives the premium and beneficiary from immutable
        accepted terms; caller-supplied amounts, approvals and payment
        destinations are invalid. Stable provider keys and durable steps protect
        retries. A failed signature compensates a confirmed mock charge; an
        uncertain outcome is unavailable and must be reconciled, never blindly
        charged again. Mock issuance is not legal insurance or real money
        movement.
  /policies/by-acceptance/{acceptanceId}/policy:
    get:
      operationId: getOwnPolicyByAcceptance
      summary: Resolve an owned acceptance to its policy
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: acceptanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current or replayed result.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Returns 404 until the signed acceptance event has been consumed, or
        if the acceptance belongs to another user. No policy is created by this
        query. Retry this read while issuance remains pending.
components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-solventa-session
    LocalWebSession:
      type: apiKey
      in: cookie
      name: solventa-session
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - traceId
      properties:
        error:
          type: string
        traceId:
          type: string
          format: uuid
    Policy:
      type: object
      additionalProperties: false
      required:
        - policyId
        - offerId
        - offerVersion
        - status
        - premium
        - currency
        - effectiveFrom
        - effectiveUntil
        - document
        - documentHash
        - synthetic
        - providerMode
        - replayed
        - traceId
      properties:
        policyId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        offerVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - pending
            - charged
            - issued
            - refunding
            - refunded
        premium:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
        currency:
          type: string
          enum:
            - COP
        effectiveFrom:
          type: string
          format: date-time
        effectiveUntil:
          type: string
          format: date-time
        document:
          type: string
        documentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        synthetic:
          type: boolean
          enum:
            - true
        providerMode:
          type: string
          enum:
            - mock
        replayed:
          type: boolean
        traceId:
          type: string
          format: uuid
    IssueRequest:
      type: object
      additionalProperties: false
      required:
        - documentHash
      properties:
        documentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
  responses:
    Invalid:
      description: Invalid JSON, media type, resource identifier, unsupported field,
        idempotency key or body exceeding 1024 bytes.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Invalid, expired or revoked user session.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Unauthorized Origin or missing consent/permission.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is absent or owned by another user.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Expired or altered resource, rejected decision or conflicting
        idempotency payload.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Identity, storage or mock provider unavailable; no partial success
        is declared.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
