openapi: 3.0.3
info:
  title: Solventa API - Policies
  version: 1.0.0
  description: Authenticated academic financial flow. Buying and issuing are web-only; the native app only reads its own issued policies. External data,
    payment and signature providers are explicitly mocked; Solventa
    authorization, owner transactions and idempotency remain real. The isolated
    production demo requires explicit FINANCIAL_PROVIDER_MODE=mock, a valid
    environment-specific FINANCIAL_EVENT_KEY and separately provisioned production
    bindings, queues and SQL. Missing or invalid configuration fails closed.
    Synthetic results do not establish real payment settlement, legal external
    signature or insurance coverage. Credentials, actor identifiers, approval and amounts cannot be
    selected by clients. All responses are no-store and correlated.
servers:
  - url: /api/v1
tags:
  - name: Policies
    description: Owner-authorized synthetic policies.
paths:
  /policies:
    get:
      operationId: listOwnPolicies
      summary: List the caller's own issued policies for the native wallet
      description: Native read-only route. The owner comes from the verified user
        access token, never from a parameter. It returns at most six issued
        policies, newest validity first, with the product, validity, premium and
        coverage; hasMore reports that older ones exist. The reviewed document,
        its hash and payment data are not returned. The device keeps a protected
        copy for offline use and treats it as stale, never as the contractual
        source.
      tags:
        - Policies
      security:
        - MobileBearer: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
      responses:
        "200":
          description: The owner's issued policies, possibly none.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /policies/{policyId}:
    get:
      operationId: getOwnPolicy
      summary: Read owned policy and the document to review
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current or replayed result.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /policies/{policyId}/issue:
    post:
      operationId: issueOwnPolicy
      summary: Confirm the reviewed document and issue a policy
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
      responses:
        "200":
          description: Current or replayed result.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Requires same-origin POST and the exact documentHash returned by
        GET. The owner derives the premium and beneficiary from immutable
        accepted terms; caller-supplied amounts, approvals and payment
        destinations are invalid. Stable provider keys and durable steps protect
        retries. A failed signature compensates a confirmed mock charge; an
        uncertain outcome is unavailable and must be reconciled, never blindly
        charged again. Mock issuance is not legal insurance or real money
        movement.
        A signature_failed response can occur during a concurrent refund;
        read the owned policy and require status refunded before confirming
        compensation. Retry an uncertain operation with its original key.
        After document_mismatch, reread and review the document before
        submitting its current server-provided fingerprint.
  /policies/by-acceptance/{acceptanceId}/policy:
    get:
      operationId: getOwnPolicyByAcceptance
      summary: Resolve an owned acceptance to its policy
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: acceptanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current or replayed result.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Returns 404 until the signed acceptance event has been consumed, or
        if the acceptance belongs to another user. No policy is created by this
        query. Retry this read while issuance remains pending. An absent
        pre-import row does not generate a financial rejection or a security
        denial notification. An existing acceptance owned by another client or
        subject produces the required financial and minimal security denial
        audits without exposing its record. The public not_found response
        remains indistinguishable; unavailable required auditing returns 503.
  /policies/issued:
    get:
      operationId: listIssuedPolicies
      summary: List the signed-in customer's issued policies for the web portal
      description: Web read-only route. The owner comes from the verified session,
        never from a parameter. It returns at most six issued policies, newest
        validity first, with the same fields as the native list. Pending,
        charged, refunding and refunded policies belong to the purchase flow and
        are not listed.
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
      responses:
        "200":
          description: The owner's issued policies, possibly none.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /policies/{policyId}/detail:
    get:
      operationId: getOwnPolicyDetail
      summary: Read the coverage, documents and premium payments of an issued policy
      description: One integrity-checked read of an issued policy. Coverage comes
        from the immutable accepted terms; exclusions come from the product
        conditions identified by conditionsVersion and are not part of the signed
        document. Documents list what can be downloaded with its issue date. The
        payment list holds the policy's single premium charge. A policy that is
        still in the purchase flow, missing or owned by another user returns the
        same opaque 404.
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail of the issued policy.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDetail"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /policies/{policyId}/documents/{documentId}:
    get:
      operationId: downloadOwnPolicyDocument
      summary: Download one document of an issued policy as PDF
      description: The PDF is generated on demand from the integrity-checked policy,
        so repeated downloads of the same document are identical. The signed
        policy and the premium receipt are synthetic demonstration documents, and
        the general conditions carry the version in PolicyDetail.conditionsVersion.
        The text is written in es-CO.
      tags:
        - Policies
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: ./common.yaml#/components/parameters/TraceId
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            enum:
              - signed_policy
              - general_conditions
              - premium_receipt
      responses:
        "200":
          description: The PDF document.
          headers:
            X-Trace-Id:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-solventa-session
    LocalWebSession:
      type: apiKey
      in: cookie
      name: solventa-session
    MobileBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WorkOS AuthKit user access token of a registered native session. Never a refresh token, M2M token or web cookie.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - traceId
      properties:
        error:
          type: string
        traceId:
          type: string
          format: uuid
    PolicyCoverage:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - kind
            - sumInsured
          properties:
            kind:
              type: string
              enum:
                - mortgage_life
            sumInsured:
              type: string
              pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
        - type: object
          additionalProperties: false
          required:
            - kind
            - flightReference
            - thresholdMinutes
            - payoutAmount
          properties:
            kind:
              type: string
              enum:
                - flight_delay
            flightReference:
              type: string
              format: uuid
            thresholdMinutes:
              type: integer
              minimum: 1
            payoutAmount:
              type: string
              pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
    PolicySummary:
      type: object
      additionalProperties: false
      required:
        - policyId
        - product
        - status
        - premium
        - currency
        - effectiveFrom
        - effectiveUntil
        - coverage
      properties:
        policyId:
          type: string
          format: uuid
        product:
          type: string
          enum:
            - vida_hipotecario
            - flight_delay
        status:
          type: string
          enum:
            - issued
        premium:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
        currency:
          type: string
          enum:
            - COP
        effectiveFrom:
          type: string
          format: date-time
        effectiveUntil:
          type: string
          format: date-time
        coverage:
          $ref: "#/components/schemas/PolicyCoverage"
    PolicyList:
      type: object
      additionalProperties: false
      required:
        - policies
        - hasMore
        - traceId
      properties:
        policies:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/PolicySummary"
        hasMore:
          type: boolean
        traceId:
          type: string
          format: uuid
    Policy:
      type: object
      additionalProperties: false
      required:
        - policyId
        - offerId
        - offerVersion
        - status
        - premium
        - currency
        - effectiveFrom
        - effectiveUntil
        - document
        - documentHash
        - synthetic
        - providerMode
        - replayed
        - traceId
      properties:
        policyId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        offerVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - pending
            - charged
            - issued
            - refunding
            - refunded
        premium:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
        currency:
          type: string
          enum:
            - COP
        effectiveFrom:
          type: string
          format: date-time
        effectiveUntil:
          type: string
          format: date-time
        document:
          type: string
        documentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        synthetic:
          type: boolean
          enum:
            - true
        providerMode:
          type: string
          enum:
            - mock
        payment:
          $ref: "#/components/schemas/PremiumPayment"
        replayed:
          type: boolean
        traceId:
          type: string
          format: uuid
    PremiumPayment:
      type: object
      additionalProperties: false
      description: Current state of the policy's single premium charge with the
        synthetic provider. Absent until the customer confirms issuance. A
        declined premium is final for this policy. The reference is the
        synthetic receipt and is present only once the provider confirmed the
        charge; it is not a real payment receipt.
      required:
        - status
        - reference
      properties:
        status:
          type: string
          enum:
            - pending
            - confirmed
            - declined
            - refunded
        reference:
          type: string
          nullable: true
          pattern: ^MOCK-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    PolicyExclusion:
      type: object
      additionalProperties: false
      required:
        - code
        - text
      properties:
        code:
          type: string
          pattern: ^[0-9]+\.[0-9]+$
        text:
          type: string
          minLength: 1
    PolicyDocumentEntry:
      type: object
      additionalProperties: false
      required:
        - documentId
        - issuedAt
      properties:
        documentId:
          type: string
          enum:
            - signed_policy
            - general_conditions
            - premium_receipt
        issuedAt:
          type: string
          format: date-time
    PolicyPaymentEntry:
      type: object
      additionalProperties: false
      description: The premium charge. date is the last state change of the stored
        payment. The reference is the synthetic receipt and is present only for a
        paid charge.
      required:
        - date
        - amount
        - currency
        - status
        - reference
      properties:
        date:
          type: string
          format: date-time
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
        currency:
          type: string
          enum:
            - COP
        status:
          type: string
          enum:
            - paid
            - pending
            - failed
        reference:
          type: string
          nullable: true
          pattern: ^MOCK-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    PolicyDetail:
      type: object
      additionalProperties: false
      required:
        - policyId
        - product
        - status
        - premium
        - currency
        - effectiveFrom
        - effectiveUntil
        - coverage
        - exclusions
        - conditionsVersion
        - documents
        - payments
        - traceId
      properties:
        policyId:
          type: string
          format: uuid
        product:
          type: string
          enum:
            - vida_hipotecario
            - flight_delay
        status:
          type: string
          enum:
            - issued
        premium:
          type: string
          pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{4}$
        currency:
          type: string
          enum:
            - COP
        effectiveFrom:
          type: string
          format: date-time
        effectiveUntil:
          type: string
          format: date-time
        coverage:
          $ref: "#/components/schemas/PolicyCoverage"
        exclusions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyExclusion"
        conditionsVersion:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDocumentEntry"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PolicyPaymentEntry"
        traceId:
          type: string
          format: uuid
    IssueRequest:
      type: object
      additionalProperties: false
      required:
        - documentHash
      properties:
        documentHash:
          type: string
          pattern: ^[0-9a-f]{64}$
  responses:
    Invalid:
      description: Invalid JSON, media type, resource identifier, unsupported field,
        idempotency key or body exceeding 1024 bytes.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Invalid, expired or revoked user session.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Unauthorized Origin or missing consent/permission.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is absent or owned by another user.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Method not allowed.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Expired or altered resource, rejected decision or conflicting
        idempotency payload.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Identity, storage or mock provider unavailable; no partial success
        is declared.
      headers:
        X-Trace-Id:
          schema:
            type: string
            format: uuid
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
