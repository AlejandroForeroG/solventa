openapi: 3.0.3
info:
  title: Solventa identity access
  version: 1.0.0
  description: Permission probes for partner integrations and authenticated web users. These endpoints do not create quotes or grant consent.
servers:
  - url: /api/v1
tags:
  - name: Access
    description: Identity-owned authorization probes.
paths:
  /access/partner:
    get:
      operationId: getPartnerAccess
      summary: Check a partner credential for quotes:create
      tags: [Access]
      description: Verifies a WorkOS Connect M2M JWT and an active local partner credential. Effective scopes are the intersection of JWT and local credential scopes. No caller-supplied partner or client ID establishes identity.
      security:
        - PartnerBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/TraceId'
      responses:
        '200':
          description: The partner currently has quotes:create permission.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /access/web:
    get:
      operationId: getWebAccess
      summary: Check the authenticated web user for quotes:create
      tags: [Access]
      description: Requires a valid sealed WorkOS cookie for a user with a verified email and an active local user/session. The probe checks quotes:create; the consent operations of the web user policy are defined in consents.yaml. No partner registration is involved and the response grants no consent. Rejects an Authorization header with 400. Does not refresh the cookie; use GET /auth/session before retrying an expired access token.
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - $ref: './common.yaml#/components/parameters/TraceId'
      responses:
        '200':
          description: The current web user principal has passed the access probe.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAccess'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    PartnerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: WorkOS Connect client_credentials access token. The partner's server holds its client secret. Requires configured issuer/audience and a matching local credential.
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-solventa-session
      description: Remote sealed HttpOnly session from the web login flow.
    LocalWebSession:
      type: apiKey
      in: cookie
      name: solventa-session
      description: Local-only sealed HttpOnly session for http://localhost:8787.
  headers:
    TraceId:
      description: Valid supplied UUID or a UUID generated by the server; also present in the response body.
      schema:
        type: string
        format: uuid
    NoStore:
      description: Access responses must not be cached.
      schema:
        type: string
        enum: [no-store]
  schemas:
    Principal:
      type: object
      required: [clientId, subjectToken]
      properties:
        clientId:
          type: string
          format: uuid
        subjectToken:
          type: string
          format: uuid
          description: Internal pseudonymous identifier. This is not an authentication token.
    PartnerActor:
      type: object
      required: [kind, partnerId, credentialId, scopes]
      properties:
        kind:
          type: string
          enum: [partner]
        partnerId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
            enum: [quotes:create]
          description: Effective allowed scopes, the intersection of JWT and local credential scopes.
    UserActor:
      type: object
      required: [kind, channel, principal, operations]
      properties:
        kind:
          type: string
          enum: [user]
        channel:
          type: string
          enum: [web]
        principal:
          $ref: '#/components/schemas/Principal'
        operations:
          type: array
          items:
            type: string
            enum: [quotes:create]
          description: Operation allowed by the web user policy for the user's own principal. It does not represent consent.
    PartnerAccess:
      type: object
      required: [actor, traceId]
      properties:
        actor:
          $ref: '#/components/schemas/PartnerActor'
        traceId:
          type: string
          format: uuid
    WebAccess:
      type: object
      required: [actor, traceId]
      properties:
        actor:
          $ref: '#/components/schemas/UserActor'
        traceId:
          type: string
          format: uuid
    AccessError:
      allOf:
        - $ref: './common.yaml#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: string
              enum: [unauthorized, forbidden, access_unavailable, method_not_allowed, invalid_request]
  responses:
    InvalidRequest:
      description: Invalid request input; error is invalid_request.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessError'
    Unauthorized:
      description: Missing, invalid or expired authentication, or invalid local web session; error is unauthorized.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessError'
    Forbidden:
      description: Inactive, absent, expired or revoked local partner credential, insufficient partner scope, or denied web origin; error is forbidden.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessError'
    MethodNotAllowed:
      description: The probe only accepts GET; error is method_not_allowed.
      headers:
        Allow:
          description: The only accepted method for access probes.
          schema:
            type: string
            enum: [GET]
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessError'
    Unavailable:
      description: Missing configuration or unavailable verification/persistence dependency; error is access_unavailable.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessError'
