openapi: 3.0.3
info:
  title: Solventa API - Partner portal
  version: 2.0.0
  description: Partner-isolated integration metadata, current enforced UTC quota and historical channel facts.
servers:
  - url: /api/v2
tags:
  - name: Partner portal
    description: Partner-isolated integration metadata and recorded channel facts.
paths:
  /partner-portal:
    get:
      operationId: readPartnerPortalV2
      summary: Read the explicitly granted partner integration
      description: Web-only read. Both UTC dates are inclusive, with at most 31 days. Unknown and repeated
        parameters are rejected. The server derives the partner from Identity, never from a caller-supplied
        partner id. Counts cover the entire period; the list contains the 20 most recent facts in descending
        time/id/kind order. completed means a stored minimum quote; accepted/preliminary/declined describe
        underwriting decisions, not customer acceptance, payment or issuance. Request failures are outside
        this ledger. Quota is the current UTC admission window, independent from the historical query. The
        persisted policy starts at trackingSince; the first day can be partial and only requests admitted by
        the quota-enabled version are counted. Versions are the global registry; operation paths in the
        catalog define actual availability. The response contains registration references and metadata, never
        provider references, tokens, customer identities or secrets.
      tags:
        - Partner portal
      security:
        - WebSession: []
        - LocalWebSession: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive UTC calendar date.
          schema: &a1
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive UTC calendar date.
          schema: *a1
        - $ref: ../v1/common.yaml#/components/parameters/TraceId
      responses:
        "200":
          description: Authorized partner data from a consistent Acquisition snapshot; real empty results contain zero
            counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerPortal"
              example:
                traceId: 11111111-1111-4111-8111-111111111111
                partner:
                  id: 22222222-2222-4222-8222-222222222222
                  code: synthetic-partner
                credentials:
                  - id: 33333333-3333-4333-8333-333333333333
                    scopes:
                      - quotes:create
                      - partner-offers:create
                    expiresAt: 2026-12-01T00:00:00.000Z
                    status: active
                hasMoreCredentials: false
                quota:
                  configured: true
                  limit: 1000
                  used: 2
                  remaining: 998
                  windowStart: 2026-11-11T00:00:00.000Z
                  resetsAt: 2026-11-12T00:00:00.000Z
                  trackingSince: 2026-11-11T10:00:00.000Z
                  updatedAt: 2026-11-11T15:00:00.000Z
                  timeZone: UTC
                catalog:
                  - product: vida_hipotecario
                    operations:
                      - method: POST
                        path: /api/v1/quotes
                        scope: quotes:create
                      - method: POST
                        path: /api/v1/partner/offers
                        scope: partner-offers:create
                versions:
                  - id: v1
                  - id: v2
                period:
                  from: 2026-11-01
                  to: 2026-11-07
                  timeZone: UTC
                updatedAt: 2026-11-07T12:00:00.000Z
                totals:
                  completed: 1
                  accepted: 1
                  preliminary: 0
                  declined: 0
                items:
                  - id: 44444444-4444-4444-8444-444444444444
                    reference: 44444444-4444-4444-8444-444444444444
                    kind: offer_decision
                    occurredAt: 2026-11-07T11:00:00.000Z
                    result: accepted
                    ruleVersion: mortgage-underwriting-1
                  - id: 55555555-5555-4555-8555-555555555555
                    reference: COT-2026-00001
                    kind: quote
                    occurredAt: 2026-11-07T10:00:00.000Z
                    result: completed
                    ruleVersion: provisional-1
                hasMore: false
        "400":
          description: Invalid or repeated query, invalid dates, range longer than 31 days, unknown parameter, or an
            Authorization header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalError"
        "401":
          description: No current web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalError"
        "403":
          description: No current explicit grant to an active partner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalError"
        "405":
          description: Only GET is supported; Allow is GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalError"
        "503":
          description: Authorization, lease or data unavailable; no zero counts are substituted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalError"
components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-solventa-session
    LocalWebSession:
      type: apiKey
      in: cookie
      name: solventa-session
      description: Local HTTP development only.
  schemas:
    PartnerPortal:
      type: object
      additionalProperties: false
      required:
        - traceId
        - partner
        - credentials
        - hasMoreCredentials
        - quota
        - catalog
        - versions
        - period
        - updatedAt
        - totals
        - items
        - hasMore
      properties:
        traceId: &a2
          type: string
          format: uuid
        partner:
          type: object
          additionalProperties: false
          required:
            - id
            - code
          properties:
            id: *a2
            code: &a5
              type: string
              minLength: 1
              maxLength: 128
        credentials:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - scopes
              - expiresAt
              - status
            properties:
              id: *a2
              scopes:
                type: array
                items:
                  type: string
                  minLength: 1
                maxItems: 32
              expiresAt: &a3
                type: string
                format: date-time
              status:
                type: string
                enum:
                  - active
                  - expired
                  - revoked
          maxItems: 20
        hasMoreCredentials: &a6
          type: boolean
        quota:
          type: object
          additionalProperties: false
          required:
            - configured
            - limit
            - used
            - remaining
            - windowStart
            - resetsAt
            - trackingSince
            - updatedAt
            - timeZone
          properties:
            configured:
              type: boolean
              enum:
                - true
            limit:
              type: integer
              minimum: 1
              maximum: 1000000000
            used:
              type: integer
              minimum: 0
            remaining:
              type: integer
              minimum: 0
            timeZone:
              type: string
              enum:
                - UTC
            windowStart:
              type: string
              format: date-time
            resetsAt:
              type: string
              format: date-time
            trackingSince:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        catalog:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - product
              - operations
            properties:
              product:
                type: string
                enum:
                  - vida_hipotecario
              operations:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - method
                    - path
                    - scope
                  properties:
                    method:
                      type: string
                      enum:
                        - POST
                    path:
                      type: string
                      enum:
                        - /api/v1/quotes
                        - /api/v1/partner/offers
                    scope:
                      type: string
                      enum:
                        - quotes:create
                        - partner-offers:create
        versions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
            properties:
              id:
                type: string
                pattern: ^v[1-9][0-9]*$
              deprecatedAt: *a1
              sunset: *a1
          minItems: 1
        period:
          type: object
          additionalProperties: false
          required:
            - from
            - to
            - timeZone
          properties:
            from: *a1
            to: *a1
            timeZone:
              type: string
              enum:
                - UTC
        updatedAt: *a3
        totals:
          type: object
          additionalProperties: false
          required:
            - completed
            - accepted
            - preliminary
            - declined
          properties:
            completed: &a4
              type: integer
              minimum: 0
              maximum: 9007199254740991
            accepted: *a4
            preliminary: *a4
            declined: *a4
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - reference
              - kind
              - occurredAt
              - result
              - ruleVersion
            properties:
              id: *a2
              reference: *a5
              kind:
                type: string
                enum:
                  - quote
                  - offer_decision
              occurredAt: *a3
              result:
                type: string
                enum:
                  - completed
                  - accepted
                  - preliminary
                  - declined
              ruleVersion: *a5
          maxItems: 20
        hasMore: *a6
    PortalError:
      type: object
      additionalProperties: false
      required:
        - error
        - traceId
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - access_unavailable
            - portal_unavailable
            - method_not_allowed
        traceId: *a2
