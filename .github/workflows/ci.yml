name: CI
on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
    inputs:
      revision:
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/git-policy.mjs pr
      - name: Require a successful upstream deployment before promotion
        if: github.base_ref == 'staging' || github.base_ref == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git diff --exit-code "$SOURCE_SHA" HEAD
          gh api "repos/$REPOSITORY/actions/workflows/deploy.yml/runs?event=push&branch=$SOURCE_BRANCH&head_sha=$SOURCE_SHA" --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run infra:up
      - run: npm run test:schema
      - run: npm run test:authentication:sql
      - run: npm run infra:local:schema-verify
      - run: npm run test:infra
      - if: always()
        run: npm run infra:down
  report:
    if: always() && github.event_name == 'pull_request'
    needs: [policy, validate]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Report CI on this PR test merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_RESULT: ${{ needs.policy.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          [[ $(jq -r '.head.sha' <<< "$pr") == "$HEAD_SHA" ]] || exit 1
          [[ $(jq -r '.base.sha' <<< "$pr") == "$BASE_SHA" ]] || exit 1
          merge=$(jq -r '.merge_commit_sha' <<< "$pr")
          [[ "$merge" =~ ^[a-f0-9]{40}$ ]] || exit 1
          for context in policy validate; do
            result="$POLICY_RESULT"
            [[ "$context" != validate ]] || result="$VALIDATE_RESULT"
            state=failure
            [[ "$result" != success ]] || state=success
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$merge" \
              -f state="$state" -f context="$context" \
              -f description="CI $context for PR #$PR_NUMBER integration commit" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
