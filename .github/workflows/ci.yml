name: CI
on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      revision:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/git-policy.mjs pr
      - name: Require the tested feature or release before promotion
        if: github.base_ref == 'staging' || github.base_ref == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_BRANCH: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: node tools/promotion-policy.mjs
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      WRANGLER_SEND_METRICS: 'false'
      SCARF_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: context
        name: Identify validation code and runner
        env:
          VALIDATION_REVISION: ${{ inputs.revision || github.sha }}
        run: node tools/validation-reuse.mjs context "$RUNNER_TEMP/solventa-validation.json"
      - id: reuse
        name: Verify prior full validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/validation-reuse.mjs lookup "$RUNNER_TEMP/solventa-validation.json"
      - if: steps.reuse.outputs.reused != 'true'
        run: npm ci
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run check
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run infra:up
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:schema
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:authentication:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:identity-verification:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:notification-preferences:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:partner-access:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:partner-authorizations:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:advisor-sale-authorizations:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:advisor-sale:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:partner-portal:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:partner-quota:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:quotes:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:consents:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:offers:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:audit:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:claims:access:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:claims:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:claim-report:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:claim-drafts:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:financial:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:security:sql
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run infra:local:schema-verify
      - if: steps.reuse.outputs.reused != 'true'
        run: npm run test:infra
      - if: always() && steps.reuse.outputs.reused != 'true'
        run: npm run infra:down
      - name: Write full validation receipt
        if: steps.reuse.outputs.reused != 'true' && steps.context.outputs.trusted == 'true'
        run: node tools/validation-reuse.mjs receipt "$RUNNER_TEMP/solventa-validation.json" "$RUNNER_TEMP/solventa-validation-receipt/validation.json"
      - name: Publish validation receipt
        if: steps.reuse.outputs.reused != 'true' && steps.context.outputs.trusted == 'true'
        uses: ./.github/actions/publish-validation
        with:
          context: ${{ runner.temp }}/solventa-validation.json
          receipt: ${{ runner.temp }}/solventa-validation-receipt/validation.json
