name: CI
on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      revision:
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/git-policy.mjs pr
      - name: Require the tested feature or release before promotion
        if: github.base_ref == 'staging' || github.base_ref == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_BRANCH: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: node tools/promotion-policy.mjs
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      WRANGLER_SEND_METRICS: 'false'
      SCARF_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run infra:up
      - run: npm run test:schema
      - run: npm run test:authentication:sql
      - run: npm run test:partner-access:sql
      - run: npm run test:quotes:sql
      - name: Verify consent persistence when included in the revision
        run: |
          if test -f infra/consents-smoke.mts; then
            npm run test:consents:sql
          else
            echo "This revision does not include the consent SQL suite."
          fi
      - run: npm run infra:local:schema-verify
      - run: npm run test:infra
      - if: always()
        run: npm run infra:down
