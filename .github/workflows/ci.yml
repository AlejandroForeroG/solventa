name: CI
on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
    inputs:
      revision:
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  codex-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Reviewed immutable gate code; never execute the PR's gate implementation.
          ref: 506a62f876376e2d3a0734b54ffb43be9afca592
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test tools/codex-review.test.mjs
      - run: node tools/codex-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/git-policy.mjs pr
      - name: Require a successful upstream deployment before promotion
        if: github.base_ref == 'staging' || github.base_ref == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git diff --exit-code "$SOURCE_SHA" HEAD
          gh api "repos/$REPOSITORY/actions/workflows/deploy.yml/runs?event=push&branch=$SOURCE_BRANCH&head_sha=$SOURCE_SHA" --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run infra:up
      - run: npm run test:schema
      - run: npm run test:authentication:sql
      - run: npm run infra:local:schema-verify
      - run: npm run test:infra
      - if: always()
        run: npm run infra:down
