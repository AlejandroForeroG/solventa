name: Codex review gate
on:
  pull_request_target:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: >-
    codex-review-${{
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        ((github.event.comment.body == '@codex review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
         (github.event.comment.user.id == 199175422 &&
          contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->'))))) &&
      (github.event.pull_request.number || github.event.issue.number) || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       ((github.event.comment.body == '@codex review' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event.comment.user.id == 199175422 &&
         contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->'))))
    environment: codex-review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Both this workflow and gate code come from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.CODEX_GATE_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_GATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Resolve PR and publish pending status on its integration commit
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          pr=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          head=$(jq -r '.head.sha' <<< "$pr")
          merge=$(jq -r '.merge_commit_sha' <<< "$pr")
          [[ "$merge" =~ ^[a-f0-9]{40}$ ]] || exit 1
          base=$(jq -r '.base.ref' <<< "$pr")
          [[ $(jq -r '.state' <<< "$pr") == open ]] || exit 1
          [[ "$base" =~ ^(dev|staging|prod)$ ]] || exit 1
          [[ -z "$EVENT_HEAD" || "$EVENT_HEAD" == "$head" ]] || exit 1
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$merge" \
            -f state=pending -f context=codex-review \
            -f description='Waiting for Codex on this commit' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Wait for the current commit review
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_MERGE_SHA: ${{ steps.pr.outputs.merge }}
        run: node tools/codex-review.mjs
      - name: Publish final status on the reviewed integration commit
        if: always() && steps.pr.outputs.head != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MERGE_SHA: ${{ steps.pr.outputs.merge }}
          GATE_RESULT: ${{ steps.gate.outcome }}
        run: |
          state=failure
          description='Codex review incomplete or failed; inspect this run'
          if [[ "$GATE_RESULT" == success ]]; then
            state=success
            description='Codex completed review of this exact commit'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$MERGE_SHA" \
            -f state="$state" -f context=codex-review -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
