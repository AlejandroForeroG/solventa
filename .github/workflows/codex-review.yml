name: Codex review gate
on:
  pull_request_target:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Codex review event]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: >-
    codex-review-${{
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.pull_requests[0].number) ||
       (github.event.issue.pull_request &&
        ((github.event.comment.body == '@codex review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
         github.event.comment.user.id == 199175422))) &&
      (github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number) || github.run_id }}
  cancel-in-progress: true
jobs:
  review:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.pull_requests[0].number) ||
      (github.event.issue.pull_request &&
       ((github.event.comment.body == '@codex review' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        github.event.comment.user.id == 199175422))
    environment: codex-review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Both this workflow and gate code come from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.CODEX_GATE_CLIENT_ID }}
          private-key: ${{ secrets.CODEX_GATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Resolve PR and publish pending status on its integration commit
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          pr=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          head=$(jq -r '.head.sha' <<< "$pr")
          merge=$(jq -r '.merge_commit_sha' <<< "$pr")
          [[ "$merge" =~ ^[a-f0-9]{40}$ ]] || exit 1
          base=$(jq -r '.base.ref' <<< "$pr")
          [[ $(jq -r '.state' <<< "$pr") == open ]] || exit 1
          [[ "$base" =~ ^(dev|staging|prod)$ ]] || exit 1
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "context=codex-review-$base" >> "$GITHUB_OUTPUT"
          for revision in "$head" "$merge"; do
            MERGE_SHA="$revision" STATUS_CONTEXT="codex-review-$base" STATUS_STATE=pending STATUS_DESCRIPTION='Waiting for Codex on this commit and environment' node tools/codex-status.mjs
          done
      - name: Wait for the current commit review
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_MERGE_SHA: ${{ steps.pr.outputs.merge }}
        run: node tools/codex-review.mjs
      - name: Publish final status on the reviewed integration commit
        if: always() && !cancelled() && steps.pr.outputs.head != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MERGE_SHA: ${{ steps.pr.outputs.merge }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          STATUS_CONTEXT: ${{ steps.pr.outputs.context }}
          STATUS_STATE: ${{ steps.gate.outcome == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ steps.gate.outcome == 'success' && 'Codex completed review of this exact commit' || 'Codex review incomplete or failed; inspect this run' }}
        run: |
          integration="$MERGE_SHA"
          for revision in "$HEAD_SHA" "$integration"; do
            MERGE_SHA="$revision" node tools/codex-status.mjs
          done
